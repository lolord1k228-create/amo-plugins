<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Еблан NFT Маркет</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f14; color: #e8e8ec; padding: 16px; padding-bottom: 40px; min-height: 100vh; }
.header { text-align: center; padding: 24px 0 20px; border-bottom: 1px solid #23232c; margin-bottom: 20px; }
.header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #667eea, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
.header p { font-size: 13px; color: #8a8a96; margin-bottom: 14px; }
#catalog { max-width: 640px; margin: 0 auto; }
.card { background: #1a1a22; border: 1px solid #26262f; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.card-icon { width: 46px; height: 46px; background: linear-gradient(135deg, #667eea22, #a855f722); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.card-title-block { flex: 1; min-width: 0; }
.card-title { font-size: 16px; font-weight: 600; color: #ffffff; line-height: 1.3; }
.card-meta { font-size: 12px; color: #8a8a96; margin-top: 3px; }
.card-desc { font-size: 13px; color: #a8a8b4; line-height: 1.5; margin-bottom: 12px; }
.btn { width: 100%; background: linear-gradient(135deg, #667eea, #a855f7); color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.bot-btn-container { margin-bottom: 20px; }
.bot-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #2ea6ff; color: white; text-decoration: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <h1>💎 Еблан NFT Маркет</h1>
  <p>Ексклюзивні цифрові активи</p>
  
  <div class="bot-btn-container">
    <a href="https://t.me/Pluginallbot" class="bot-btn" target="_blank">🤖 Перейти до @Pluginallbot</a>
  </div>
</div>

<div id="catalog"></div>

<script>
var PLUGINS_CATALOG = [
  {
    name: "Еблан NFT",
    version: "1.1.5",
    author: "NFT Market",
    description: "Ексклюзивний плагін. Натисни щоб відкрити меню встановлення.",
    url: "https://cdn.jsdelivr.net/gh/lolord1k228-create/amo-plugins@main/plugin/test_plugin.plugin"
  }
];

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function loadCatalog() {
  var container = document.getElementById('catalog');
  var html = '';
  for (var j = 0; j < PLUGINS_CATALOG.length; j++) {
    var p = PLUGINS_CATALOG[j];
    html +=
      '<div class="card">' +
        '<div class="card-header">' +
          '<div class="card-icon">🖼️</div>' +
          '<div class="card-title-block">' +
            '<div class="card-title">' + escapeHtml(p.name) + '</div>' +
            '<div class="card-meta">v' + escapeHtml(p.version) + ' · ' + escapeHtml(p.author) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-desc">' + escapeHtml(p.description) + '</div>' +
        '<button class="btn" onclick="openPluginMenu(\'' + p.url + '\')">⬇️ Скачати та Встановити</button>' +
      '</div>';
  }
  container.innerHTML = html;
}

function openPluginMenu(url) {
  // Передаємо команду плагіну, щоб він відкрив своє меню ℹ️
  window.location.href = 'amo://open_menu';
}

loadCatalog();
</script>
</body>
</html>
