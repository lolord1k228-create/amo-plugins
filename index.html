<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Магазин плагінів AMO</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f14;
  color: #e8e8ec;
  padding: 16px;
  padding-bottom: 40px;
  min-height: 100vh;
}

.header {
  text-align: center;
  padding: 24px 0 20px;
  border-bottom: 1px solid #23232c;
  margin-bottom: 20px;
}

.header h1 {
  font-size: 26px;
  font-weight: 700;
  background: linear-gradient(135deg, #667eea, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.header p {
  font-size: 13px;
  color: #8a8a96;
  margin-bottom: 14px;
}

.refresh-btn {
  background: #1c1c26;
  color: #b8b8c4;
  border: 1px solid #2e2e3a;
  padding: 9px 20px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s;
}

.refresh-btn:active {
  background: #2a2a36;
  transform: scale(0.96);
}

#catalog {
  max-width: 640px;
  margin: 0 auto;
}

.card {
  background: #1a1a22;
  border: 1px solid #26262f;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  transition: transform 0.15s;
}

.card:active {
  transform: scale(0.985);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.card-icon {
  width: 46px;
  height: 46px;
  background: linear-gradient(135deg, #667eea22, #a855f722);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.card-title-block {
  flex: 1;
  min-width: 0;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  word-break: break-word;
  line-height: 1.3;
}

.card-meta {
  font-size: 12px;
  color: #8a8a96;
  margin-top: 3px;
}

.card-desc {
  font-size: 13px;
  color: #a8a8b4;
  line-height: 1.5;
  margin-bottom: 12px;
  word-break: break-word;
}

.btn {
  width: 100%;
  background: linear-gradient(135deg, #667eea, #a855f7);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}

.btn:active {
  opacity: 0.7;
}

.empty,
.loading {
  text-align: center;
  padding: 60px 20px;
  color: #6a6a76;
  font-size: 15px;
}

.empty small {
  font-size: 12px;
  color: #4a4a56;
  display: block;
  margin-top: 8px;
}

.spinner {
  display: inline-block;
  width: 32px;
  height: 32px;
  border: 3px solid #2a2a36;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: #2a2a36;
  color: white;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  transition: transform 0.3s;
  z-index: 9999;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  max-width: 90vw;
  text-align: center;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="header">
  <h1>📦 Магазин плагінів</h1>
  <p>All Messages Options · <span id="count">завантаження...</span></p>
  <button class="refresh-btn" onclick="loadCatalog()">🔄 Оновити</button>
</div>

<div id="catalog">
  <div class="loading">
    <div class="spinner"></div>
    <div>Завантажую каталог...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
//                    НАЛАШТУВАННЯ
// ═══════════════════════════════════════════════════════════
var GITHUB_USER = 'lolord1k228-create';
var GITHUB_REPO = 'amo-plugins';
var GITHUB_BRANCH = 'main';
var GITHUB_FOLDER = 'plugin';

// ═══════════════════════════════════════════════════════════
//                    ЛОГІКА
// ═══════════════════════════════════════════════════════════

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() {
    t.classList.remove('show');
  }, 2500);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function parseMeta(content) {
  var meta = {};
  var keys = ['__id__', '__name__', '__version__', '__author__', '__description__', '__icon__'];
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var re = new RegExp(key + '\\s*=\\s*["\'](.+?)["\']');
    var m = content.match(re);
    if (m) meta[key] = m[1];
  }
  return meta;
}

function cdnUrl(filename) {
  return 'https://cdn.jsdelivr.net/gh/' + GITHUB_USER + '/' + GITHUB_REPO +
         '@' + GITHUB_BRANCH + '/' + GITHUB_FOLDER + '/' + filename + '?t=' + Date.now();
}

function apiUrl() {
  return 'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO +
         '/contents/' + GITHUB_FOLDER;
}

async function fetchFiles() {
  var resp = await fetch(apiUrl(), {
    headers: {
      'Accept': 'application/vnd.github+json',
      'Cache-Control': 'no-cache'
    }
  });
  if (!resp.ok) throw new Error('GitHub API: ' + resp.status);
  return await resp.json();
}

async function fetchMeta(downloadUrl) {
  try {
    var resp = await fetch(downloadUrl, {
      headers: { 'Range': 'bytes=0-2048' }
    });
    if (!resp.ok) return {};
    var text = await resp.text();
    return parseMeta(text);
  } catch (e) {
    return {};
  }
}

async function loadCatalog() {
  var container = document.getElementById('catalog');
  var countEl = document.getElementById('count');

  container.innerHTML =
    '<div class="loading"><div class="spinner"></div><div>Завантажую каталог...</div></div>';
  countEl.textContent = 'завантаження...';

  try {
    var files = await fetchFiles();
    if (!Array.isArray(files)) throw new Error('Некоректна відповідь API');

    var plugins = [];
    for (var i = 0; i < files.length; i++) {
      var item = files[i];
      if (item.type !== 'file') continue;
      var name = item.name || '';
      if (!name.endsWith('.plugin')) continue;
      if (name.toLowerCase() === 'all_messages_options.plugin') continue;

      var meta = await fetchMeta(item.download_url);
      plugins.push({
        filename: name,
        name: meta.__name__ || name,
        version: meta.__version__ || '?',
        author: meta.__author__ || '?',
        description: (meta.__description__ || '').replace(/\n/g, ' '),
        url: cdnUrl(name)
      });
    }

    countEl.textContent = plugins.length + ' плагінів';

    if (plugins.length === 0) {
      container.innerHTML =
        '<div class="empty">Каталог порожній<small>Додай .plugin файли у папку plugin/ на GitHub</small></div>';
      return;
    }

    var html = '';
    for (var j = 0; j < plugins.length; j++) {
      var p = plugins[j];
      html +=
        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="card-icon">📦</div>' +
            '<div class="card-title-block">' +
              '<div class="card-title">' + escapeHtml(p.name) + '</div>' +
              '<div class="card-meta">v' + escapeHtml(p.version) + ' · ' + escapeHtml(p.author) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="card-desc">' + escapeHtml(p.description) + '</div>' +
          '<button class="btn" onclick="installPlugin(\'' +
            p.url.replace(/'/g, "\\'") + '\', \'' +
            escapeHtml(p.name).replace(/'/g, "\\'") + '\')">⬇️ Встановити</button>' +
        '</div>';
    }
    container.innerHTML = html;

  } catch (e) {
    console.error(e);
    container.innerHTML =
      '<div class="empty">❌ Помилка<small>' + escapeHtml(e.message) + '</small></div>';
    countEl.textContent = 'помилка';
    showToast('❌ ' + e.message);
  }
}

function installPlugin(url, name) {
  try {
    // Створюємо <a download> — це викличе DownloadListener у WebView exteraGram
    var a = document.createElement('a');
    a.href = url;
    a.download = name + '.plugin';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 100);

    showToast('⬇️ Завантажую: ' + name);
  } catch (e) {
    showToast('❌ ' + e.message);
  }
}

// Запуск при завантаженні сторінки
loadCatalog();
</script>

</body>
